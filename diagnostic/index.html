<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ============================================================
       MERIDIAN: 2-minute diagnostic   (served at /diagnostic)
       ------------------------------------------------------------
       Seven taps, then a recommendation: the Meridian service that
       fits best, two alternatives, and why. Built to work on a phone
       or an iPad handed across a salon counter.

       Questions, services and scoring all live in diagnostic.js.
       Answers are sent through /js/forms.js (same as the contact
       form), so nothing is sent until that has a key.

       Styling: /css/site.css (the homepage stylesheet, shared) plus
       /diagnostic/diagnostic.css for the quiz itself.

       Add ?src=visit (or any word) to the link to tag where a
       response came from, e.g. a QR code on a leave-behind card.
       ============================================================ -->

  <title>Find your biggest time-waster | Meridian</title>
  <meta name="description" content="Seven quick questions. Find out which practical fix would save your salon, spa or studio the most time, and where to start." />

  <link rel="icon" type="image/png" href="/assets/meridian-logo.png" />
  <link rel="apple-touch-icon" href="/assets/meridian-logo.png" />

  <meta property="og:title" content="Meridian | Find your biggest time-waster" />
  <meta property="og:description" content="Seven quick questions for salons, spas and studios. Get a recommendation in two minutes." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.meridianaiservices.com/diagnostic" />
  <meta property="og:image" content="https://www.meridianaiservices.com/assets/meridian-logo.png" />
  <meta name="twitter:card" content="summary" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@600&family=League+Spartan:wght@400;500;600;700&family=Libre+Franklin:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/css/site.css" />
  <link rel="stylesheet" href="/diagnostic/diagnostic.css" />
</head>

<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header dx-header">
    <div class="wrap header-bar">
      <a class="brand" href="/" aria-label="Meridian home">
        <img src="/assets/meridian-logo.png" alt="" width="28" height="31" />
      </a>
      <a class="btn btn-gold dx-header-cta" href="/#contact">Book a free audit</a>
    </div>
  </header>

  <main id="main" class="dx-main band">
    <div class="dx-wrap">
      <div class="dx-card" id="dx" aria-live="polite">
        <!-- Filled by diagnostic.js. This fallback shows if JavaScript is off. -->
        <noscript>
          <p>This diagnostic needs JavaScript. You can still <a href="/#contact">book a free audit</a>.</p>
        </noscript>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-grid">
      <div>
        <a class="brand" href="/" aria-label="Meridian home">
          <img src="/assets/meridian-logo.png" alt="" width="24" height="26" />
          <span>Meridian</span>
        </a>
        <p>Missed-call text-back and website chat for owner-run salons and spas. Frisco, TX.</p>
      </div>
      <ul>
        <li><a href="/demo">Live demo</a></li>
        <li><a href="/diagnostic">2-minute diagnostic</a></li>
        <li><a href="/#contact">Book a free audit</a></li>
        <li><a href="/privacy">Privacy</a></li>
      </ul>
      <p class="copyright">&copy; 2026 Meridian</p>
    </div>
  </footer>

  <script src="/js/forms.js"></script>
  <script src="/diagnostic/diagnostic.js"></script>
</body>
</html>
